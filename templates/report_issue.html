<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART ROADS - Report Issue</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; padding: 30px; min-height: 100vh; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid #21262d; margin-bottom: 30px; max-width: 700px; margin-left: auto; margin-right: auto; }
        header h1 { color: #f0f6fc; font-size: 22px; }
        
        .back-btn { background-color: #21262d; color: #c9d1d9; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 14px; border: 1px solid #30363d; transition: 0.2s; }
        .back-btn:hover { background-color: #30363d; color: #fff; }

        .form-container { max-width: 700px; margin: 0 auto; background-color: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 30px; }
        h2 { color: #f0f6fc; font-size: 20px; margin-bottom: 8px; }
        p.desc { color: #8b949e; font-size: 14px; margin-bottom: 25px; }

        .alert-success { background-color: rgba(46, 160, 67, 0.15); border: 1px solid rgba(46, 160, 67, 0.4); color: #3fb950; padding: 12px 16px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }

        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 14px; color: #c9d1d9; margin-bottom: 8px; font-weight: 500; }
        input[type="text"], select, textarea { width: 100%; padding: 10px 12px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 6px; color: #f0f6fc; font-size: 14px; outline: none; }
        input[type="text"]:focus, select:focus, textarea:focus { border-color: #58a6ff; }
        textarea { resize: vertical; height: 100px; }

        .submit-btn { background-color: #238636; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; }
        .submit-btn:hover { background-color: #2ea043; }
    </style>
</head>
<body>

    <header>
        <h1>🚦 SMART ROADS</h1>
        <a href="{{ url_for('public_portal') }}" class="back-btn">← Public Portal</a>
    </header>

    <div class="form-container">
        <h2>Report a Road or Traffic Issue</h2>
        <p class="desc">Submit details about traffic violations, broken signals, accidents, or road hazards.</p>

        {% if message %}
            <div class="alert-success">
                ✅ {{ message }}
            </div>
        {% endif %}
        {% if submitted %}
            <div class="alert-success">
                ✅ Report submitted successfully! Our traffic control team will review it.
            </div>
        {% endif %}

        <form action="{{ url_for('report_issue') }}" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter full name" required>
            </div>

            <div class="form-group">
                <label for="location">Location / Intersection</label>
                <input type="text" id="location" name="location" placeholder="e.g. Main Junction, City Road" required>
            </div>

            <div class="form-group">
                <label for="issue_type">Type of Issue</label>
                <select id="issue_type" name="issue_type" required>
                    <option value="" disabled selected>Select issue category</option>
                    <option value="Traffic Light Failure">Traffic Light Failure</option>
                    <option value="Severe Congestion">Severe Congestion</option>
                    <option value="Road Hazard / Pothole">Road Hazard / Pothole</option>
                    <option value="Accident Report">Accident Report</option>
                    <option value="Illegal Parking">Illegal Parking</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description">Issue Description</label>
                <textarea id="description" name="description" placeholder="Provide additional details regarding the issue..." required></textarea>
            </div>

            <button type="submit" class="submit-btn">Submit Report</button>
        </form>
    </div>

</body>
</html>
