<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Traffic Analysis</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        header {
            background: #17202a;
            color: white;
            padding: 25px 40px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            padding: 30px 40px;
        }

        .upload-box {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .upload-box h2 {
            margin-top: 0;
        }

        input[type="file"] {
            margin: 20px;
        }

        button {
            background: #17202a;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #273746;
        }

        .results {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.08);
        }

        .value {
            font-size: 30px;
            font-weight: bold;
            margin-top: 10px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #17202a;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>📹 Traffic Analysis</h1>
    <p>AI-powered traffic monitoring</p>
</header>

<div class="container">

    <a href="/" class="back">← Back to Dashboard</a>

    <div class="upload-box">

        <h2>Upload Traffic Video</h2>

        <p>Select a traffic video for AI analysis.</p>

        <form action="/upload" method="POST" enctype="multipart/form-data">

    <input type="file" name="video" accept="video/*" required>

    <br><br>

    <button type="submit">Upload & Analyze</button>

</form>

        <br>

        <button>Start Analysis</button>

    </div>

    <div class="results">

        <div class="card">
            <h3>🚗 Vehicles Detected</h3>
            <div class="value">0</div>
        </div>

        <div class="card">
            <h3>📊 Traffic Density</h3>
            <div class="value">Not Analyzed</div>
        </div>

        <div class="card">
            <h3>🚦 Recommended Green Time</h3>
            <div class="value">-- sec</div>
        </div>

    </div>

</div>

</body>

</html>
