<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Authority Login - ROADVISION AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;

            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.60),
                    rgba(0, 0, 0, 0.60)
                ),
                url("/static/images/background.jpg");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .login-box {
            width: 380px;
            padding: 40px;

            background: rgba(10, 20, 30, 0.92);

            border-radius: 20px;

            text-align: center;

            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.8);
        }

        h1 {
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cccccc;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 13px;

            margin-top: 15px;

            border: none;
            border-radius: 8px;

            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 13px;

            margin-top: 20px;

            border: none;
            border-radius: 8px;

            cursor: pointer;

            font-size: 16px;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.02);
        }

        .error {
            color: #ff7777;
            margin-top: 15px;
        }

        .back {
            display: block;

            margin-top: 20px;

            color: white;
            text-decoration: none;
        }

    </style>

</head>


<body>

    <div class="login-box">

        <h1>👮 Authority Login</h1>

        <p class="subtitle">
            Authorized Personnel Only
        </p>

        <form method="POST">

            <input
                type="text"
                name="authority_id"
                placeholder="Enter Authority ID"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >

            <button type="submit">
                LOGIN
            </button>

        </form>


        {% if error %}

            <p class="error">
                {{ error }}
            </p>

        {% endif %}


        <a href="/" class="back">
            ← Back to Home
        </a>

    </div>

</body>

</html>
